name: CI

# Fast, DB-free regression net for the monorepo: typecheck, build, and the
# API unit tests (PrismaService is mocked, so no Postgres/Redis is needed).
# Slow Playwright e2e is intentionally NOT run here.
on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Cheap guard (node only, no install) for the release pipeline's core
  # invariant: a `vX.Y.Z` tag must match the version committed in EVERY
  # artifact — root/api/web/mcp/shared package.json plus the Helm chart's
  # `version` AND `appVersion` and the pinned Kustomize image tags. Catching
  # drift here (on every push) means `release.yml`'s identical check can never
  # be the first time anyone notices.
  versions:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: All artifact versions agree
        run: node scripts/sync-versions.mjs --check

      # A file sync-versions.mjs REWRITES but release.config.mjs does not list
      # in @semantic-release/git `assets` is rewritten during a release and then
      # never committed — so the check above goes red on the next push and stays
      # red until a human commits it. Assert the containment instead of trusting
      # two hand-maintained lists to stay in step.
      - name: Release commits every file the version sync writes
        run: |
          set -euo pipefail
          missing=0
          assets="$(node -e "
            import('./release.config.mjs').then(({default: c}) => {
              const git = c.plugins.find(p => Array.isArray(p) && p[0] === '@semantic-release/git');
              if (!git) { console.error('no @semantic-release/git plugin'); process.exit(1); }
              console.log(git[1].assets.join('\n'));
            });
          ")"
          while read -r f; do
            [ -z "$f" ] && continue
            if ! printf '%s\n' "$assets" | grep -qxF "$f"; then
              echo "::error file=release.config.mjs::sync-versions.mjs writes '$f' but @semantic-release/git assets does not list it"
              missing=1
            fi
          done < <(node scripts/sync-versions.mjs --files)
          [ "$missing" -eq 0 ] && echo "✓ every synced file is committed by the release"

  # Kustomize deploy path. Nothing rendered these overlays in CI, and both had
  # rotted silently: every image pointed at `ghcr.io/next-lane/...` (a namespace
  # that does not exist — we publish to `ghcr.io/<owner>/`), and base+prod
  # pinned a `1.0.0` that was never released. A user following
  # docs/DEPLOY-KUBERNETES.md got ImagePullBackOff on a green build.
  #
  # This renders each overlay and asserts the resulting image refs EXACTLY match
  # the expected set — so a bad namespace, an unsynced tag, or a no-op image
  # transformer all fail here instead of in someone's cluster.
  kustomize:
    name: Kustomize overlays render
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # `ubuntu-latest` already ships kustomize, and its installer hard-fails
      # ("/usr/local/bin/kustomize exists. Remove it first.") rather than
      # no-op'ing — so only fetch when the runner image stops providing it.
      # The assertions below are version-agnostic.
      - name: Ensure kustomize
        run: |
          set -euo pipefail
          if command -v kustomize >/dev/null 2>&1; then
            echo "Using kustomize preinstalled on the runner."
          else
            curl -fsSL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
              | bash -s -- 5.4.3 /usr/local/bin
          fi
          kustomize version

      # Derive the owner the same way images.yml does, so a fork that publishes
      # to its own namespace still passes.
      - name: Assert rendered images
        run: |
          set -euo pipefail
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          version="$(node scripts/sync-versions.mjs --print)"

          check() {
            local overlay="$1" tag="$2"
            local expected actual
            expected="$(printf 'ghcr.io/%s/next-lane-api:%s\nghcr.io/%s/next-lane-web:%s\n' \
              "$owner" "$tag" "$owner" "$tag" | sort -u)"
            actual="$(kustomize build "deploy/kustomize/overlays/$overlay" \
              | sed -n 's/^[[:space:]]*image:[[:space:]]*//p' | sort -u)"
            if [ "$expected" != "$actual" ]; then
              echo "::error::overlay '$overlay' rendered unexpected images"
              diff <(echo "$expected") <(echo "$actual") || true
              return 1
            fi
            echo "✓ $overlay:"; echo "$actual" | sed 's/^/    /'
          }

          # prod pins the released version; dev deliberately tracks `latest`.
          check prod "$version"
          check dev latest

  build-test:
    name: Build, typecheck & unit test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @next-lane/api exec prisma generate

      - name: Build all packages
        run: pnpm -r build

      - name: Unit tests
        run: pnpm -r test

      - name: Typecheck API
        run: pnpm --filter @next-lane/api exec tsc --noEmit

      - name: Typecheck web
        run: pnpm --filter @next-lane/web exec tsc --noEmit

  integration-test:
    name: Integration specs (tenant isolation + PAT-scope guards)
    runs-on: ubuntu-latest
    # The DB-backed safety nets — tenant-isolation, pat-scope-rollout (per-route
    # DENY/ALLOW), and pat-scope-coverage (every @RequireScope route is rostered
    # and every route is scoped-or-exempt). These boot the REAL AppModule against
    # a real Postgres, so they can't run in the DB-free unit lane above. Without
    # this job they never ran in CI — a correct guard that never executes catches
    # nothing (a page-data scope leak shipped past exactly this gap; 2026-07-10).
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nextlane_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nextlane_test?schema=public
      JWT_SECRET: ci-integration-secret
      RATE_LIMIT_DISABLED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ts-jest compiles the API from source, and the API imports
      # `@next-lane/shared`, whose package.json points at ./dist/index.d.ts —
      # a build artifact that is NOT committed. Without this step every spec
      # fails with TS2307 "Cannot find module '@next-lane/shared'". The
      # build-test job gets this for free via `pnpm -r build`; this job runs
      # on a separate runner and must build it explicitly. Only `shared` is
      # needed (not a full `-r build`) since ts-jest handles the API itself.
      - name: Build shared package (emits the .d.ts the API imports)
        run: pnpm --filter @next-lane/shared build

      - name: Generate Prisma client
        run: pnpm --filter @next-lane/api exec prisma generate

      - name: Apply migrations
        run: pnpm --filter @next-lane/api exec prisma migrate deploy

      - name: Run integration specs
        run: pnpm --filter @next-lane/api test:isolation

  docker-build:
    name: Production image build (compose)
    runs-on: ubuntu-latest
    # Guards the production images against workspace/lockfile changes: the api
    # and web Dockerfiles install with --frozen-lockfile, so a new workspace
    # package or an out-of-sync lockfile would break `docker compose build`
    # even when the fast unit job above is green. Build only (no DB/services).
    #
    # docker-compose.yml declares JWT_SECRET as REQUIRED (`${JWT_SECRET:?…}`),
    # and compose interpolates the whole file up-front — so even a build-only
    # invocation fails without it. This is a throwaway CI value: nothing here
    # starts a container or signs a token, it only satisfies interpolation.
    env:
      JWT_SECRET: ci-build-only-not-a-real-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Cheap (no build, no containers — just `docker compose config`)
      # regression guard for the env-passthrough bug class (2026-07-06,
      # commit 3c22f21): every variable .env.example documents must actually
      # reach the api service's rendered environment, and every ${VAR} the
      # api service reads must be documented. Runs first so a config-parity
      # break fails fast, before the slower image build below.
      - name: Config-parity check (docker-compose.yml vs .env.example)
        run: ./scripts/smoke-config-parity.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build api + web images
        run: docker compose build api web
