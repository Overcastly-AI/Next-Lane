# Deploy the VitePress documentation site to GitHub Pages.
#
# Before this workflow can deploy, enable GitHub Pages once:
#   Settings → Pages → Source: GitHub Actions
#
# The site will be published at: https://overcastly-ai.github.io/Next-Lane/

name: Deploy docs to GitHub Pages

on:
  push:
    branches:
      - main
      - "claude/jira-competitor-docker-local-9b7dll"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build VitePress site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Required for lastUpdated timestamps

      # No `version:` here — defer to the root package.json `packageManager`
      # field (pnpm@9.12.0). Pinning a version that differs from it makes
      # pnpm/action-setup@v6 fail with "Multiple versions of pnpm specified".
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Build docs
        run: pnpm --filter @next-lane/docs docs:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs-site/.vitepress/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
