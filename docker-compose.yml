services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nextlane}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nextlane}
      POSTGRES_DB: ${POSTGRES_DB:-nextlane}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nextlane} -d ${POSTGRES_DB:-nextlane}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # REDIS_URL is set below so the api uses the Redis adapter + BullMQ queue.
    #
    # Every operator-facing variable documented in .env.example is forwarded
    # here — a var that works in `pnpm dev` must work identically in the
    # stock compose deployment (audit pass 13, finding 1: SMTP_* silently
    # never reached the container, so password-reset email was dead in every
    # stock self-hosted deploy). Vars the code reads with a `?? default` get
    # the SAME default here (an empty string would override `??`); vars
    # checked for truthiness or parsed with `Number(x) || default` pass
    # through empty harmlessly when unset.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nextlane}:${POSTGRES_PASSWORD:-nextlane}@db:5432/${POSTGRES_DB:-nextlane}?schema=public
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET must be set - see .env.example}"
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      REDIS_URL: redis://redis:6379
      API_PORT: 4000
      NODE_ENV: production
      # Seed demo data on first boot of the local/demo stack. Production
      # deployments should set AUTO_SEED=false to prevent auto-seeding.
      AUTO_SEED: ${AUTO_SEED:-true}
      # Browser-facing origins (CORS allowlist for REST + Socket.io).
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      # Base URL used in password-reset (and other) emails back to the web app.
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:3000}
      # SMTP email delivery — unset = dev mode (reset links logged, not sent).
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-Next Lane <no-reply@example.com>}
      # Integration secrets-at-rest encryption + webhook helper URLs.
      GITHUB_TOKEN_ENCRYPTION_KEY: ${GITHUB_TOKEN_ENCRYPTION_KEY:-}
      GITHUB_WEBHOOK_BASE_URL: ${GITHUB_WEBHOOK_BASE_URL:-}
      GITLAB_TOKEN_ENCRYPTION_KEY: ${GITLAB_TOKEN_ENCRYPTION_KEY:-}
      GITLAB_WEBHOOK_BASE_URL: ${GITLAB_WEBHOOK_BASE_URL:-}
      GITEA_TOKEN_ENCRYPTION_KEY: ${GITEA_TOKEN_ENCRYPTION_KEY:-}
      GITEA_WEBHOOK_BASE_URL: ${GITEA_WEBHOOK_BASE_URL:-}
      OIDC_CONFIG_ENCRYPTION_KEY: ${OIDC_CONFIG_ENCRYPTION_KEY:-}
      # Env-based OIDC bootstrap (optional; admin UI config supersedes).
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI:-}
      OIDC_BUTTON_LABEL: ${OIDC_BUTTON_LABEL:-}
      # Outbound webhook SSRF guard escape hatch for private-network targets.
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-}
      # Rate limiting (Number(x) || default in code — empty passes through).
      THROTTLE_TTL: ${THROTTLE_TTL:-}
      THROTTLE_LIMIT: ${THROTTLE_LIMIT:-}
      THROTTLE_AUTH_LIMIT: ${THROTTLE_AUTH_LIMIT:-}
      RATE_LIMIT_DISABLED: ${RATE_LIMIT_DISABLED:-}
      # Attachment upload cap in bytes (empty = code default).
      MAX_FILE_BYTES: ${MAX_FILE_BYTES:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RELEASE_VERSION: ${RELEASE_VERSION:-}
      # ── Object storage ────────────────────────────────────────────────────
      # Unset/`local` keeps uploads on the `uploads` volume below (the default;
      # nothing to run). Set STORAGE_DRIVER=s3 to use any S3-compatible store:
      # the bundled MinIO (`--profile minio`), Ceph RADOS Gateway, AWS S3, R2.
      STORAGE_DRIVER: ${STORAGE_DRIVER:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PREFIX: ${S3_PREFIX:-}
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - uploads:/app/uploads

  # Optional S3-compatible object storage for local/self-host use.
  #
  # Behind a COMPOSE PROFILE, so the default `docker compose up -d` is
  # unchanged — no extra container, no extra memory, uploads still on the
  # `uploads` volume. Opt in with:
  #
  #   docker compose --profile minio up -d
  #
  # then set in .env:
  #   STORAGE_DRIVER=s3
  #   S3_BUCKET=next-lane
  #   S3_ENDPOINT=http://minio:9000
  #   S3_ACCESS_KEY_ID / S3_SECRET_ACCESS_KEY  (match the MINIO_ROOT_* below)
  #
  # MinIO rather than Ceph for the single-host case on purpose: Ceph is a
  # cluster filesystem and running one to back a laptop install would be
  # absurd. Both speak S3, so the app code is identical — point S3_ENDPOINT at
  # a Ceph RADOS Gateway in production and nothing else changes.
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    profiles: ["minio"]
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-nextlane}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-nextlane-dev-secret}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 12

  # One-shot: create the bucket so the API doesn't 500 on first upload against
  # a brand-new MinIO. Idempotent (`ignore` on an existing bucket) and exits.
  minio-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    profiles: ["minio"]
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 '${S3_ACCESS_KEY_ID:-nextlane}' '${S3_SECRET_ACCESS_KEY:-nextlane-dev-secret}' &&
      mc mb --ignore-existing local/'${S3_BUCKET:-next-lane}' &&
      echo 'bucket ready'
      "

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:4000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-3000}:80"

volumes:
  postgres-data:
  redis-data:
  uploads:
  minio-data:
