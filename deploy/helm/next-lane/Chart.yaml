apiVersion: v2
name: next-lane
description: |
  Next Lane — open-source, self-hosted issue & project tracker.
  NestJS API + React/Vite static web, with optional bundled PostgreSQL and
  Redis (plain in-chart manifests on the official images, no subcharts) or
  external/managed datastores.
type: application

# Chart version — bump on every chart change (SemVer).
#
# `version` and `appVersion` are kept IDENTICAL and are owned by
# `scripts/sync-versions.mjs`: one `vX.Y.Z` tag ships the images, the npm
# package and this chart together, and `release.yml` refuses to publish if any
# of them disagree. Do not hand-edit — run `node scripts/sync-versions.mjs X.Y.Z`.
version: 0.1.5

# Version of the Next Lane application this chart deploys by default
# (the image tag used when image.api.tag / image.web.tag are empty).
appVersion: "0.1.5"

home: https://github.com/Overcastly-AI/Next-Lane
sources:
  - https://github.com/Overcastly-AI/Next-Lane
keywords:
  - issue-tracker
  - project-management
  - kanban
  - agile
  - self-hosted
maintainers:
  - name: Next Lane contributors

# NO third-party chart dependencies. The optional bundled PostgreSQL and Redis
# are plain in-chart manifests on the OFFICIAL postgres / redis images
# (templates/postgres.yaml, templates/redis.yaml), each gated by *.enabled in
# values.yaml. This removes the prior Bitnami subchart dependency — Bitnami
# relicensed and moved its images off Docker Hub, which broke
# `helm dependency update` and image pulls. The chart now installs with NO
# `helm dependency update` / registry fetch required, air-gapped or not.
# For production, set postgresql.enabled=false / redis.enabled=false and point
# at managed datastores via values.externalDatabase / values.externalRedis.
