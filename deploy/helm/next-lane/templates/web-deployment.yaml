apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "next-lane.componentName" (dict "ctx" . "component" "web") }}
  labels:
    {{- include "next-lane.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.web.autoscaling.enabled }}
  replicas: {{ .Values.web.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "next-lane.componentSelectorLabels" (dict "ctx" . "component" "web") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "next-lane.componentLabels" (dict "ctx" . "component" "web") | nindent 8 }}
        {{- with .Values.web.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        {{- if eq .Values.web.apiMode "same-origin" }}
        checksum/nginx: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- end }}
        {{- with .Values.web.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "next-lane.serviceAccountName" . }}
      {{- include "next-lane.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.web.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: web
          image: {{ include "next-lane.webImage" . }}
          imagePullPolicy: {{ .Values.image.web.pullPolicy }}
          {{- with .Values.web.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          env:
            # The root FS is read-only, so the entrypoint writes the runtime
            # config.js to this writable volume instead of the image's html dir;
            # nginx serves /config.js from here (see the web-nginx ConfigMap).
            - name: NL_RUNTIME_DIR
              value: /usr/share/nginx/runtime
            {{- if eq .Values.web.apiMode "same-origin" }}
            # Same-origin: the SPA must issue RELATIVE requests (nginx proxies
            # /api + /socket.io). An explicit empty value selects that mode.
            - name: API_URL
              value: ""
            {{- else if .Values.web.apiUrl }}
            # External API origin injected at runtime (no rebuild required).
            - name: API_URL
              value: {{ .Values.web.apiUrl | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.web.port }}
          {{- if .Values.web.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.web.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.liveness.periodSeconds }}
          {{- end }}
          {{- if .Values.web.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: {{ .Values.web.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.web.probes.readiness.periodSeconds }}
          {{- end }}
          {{- with .Values.web.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # nginx needs writable scratch dirs under a read-only root FS.
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: tmp
              mountPath: /tmp
            # Writable dir for the entrypoint-generated config.js (the html dir
            # is read-only). nginx serves /config.js from here via `alias`.
            - name: web-runtime
              mountPath: /usr/share/nginx/runtime
            {{- if eq .Values.web.apiMode "same-origin" }}
            # Override the image's default server block with the reverse-proxy
            # config so the SPA + /api + /socket.io share one origin.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
              readOnly: true
            {{- end }}
      volumes:
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
        - name: web-runtime
          emptyDir: {}
        {{- if eq .Values.web.apiMode "same-origin" }}
        - name: nginx-conf
          configMap:
            name: {{ include "next-lane.componentName" (dict "ctx" . "component" "web-nginx") }}
        {{- end }}
      {{- with .Values.web.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.web.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
