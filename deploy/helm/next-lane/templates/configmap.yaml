{{- /* Non-secret API environment. Secrets are injected separately from a Secret. */ -}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "next-lane.componentName" (dict "ctx" . "component" "api-config") }}
  labels:
    {{- include "next-lane.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
data:
  NODE_ENV: {{ .Values.api.env.NODE_ENV | quote }}
  API_PORT: {{ .Values.api.port | quote }}
  LOG_LEVEL: {{ .Values.api.env.LOG_LEVEL | quote }}
  JWT_EXPIRES_IN: {{ .Values.api.env.JWT_EXPIRES_IN | quote }}
  {{- $cors := include "next-lane.corsOrigins" . }}
  {{- if $cors }}
  CORS_ORIGINS: {{ $cors | quote }}
  {{- end }}
  {{- if .Values.api.env.resetBaseUrl }}
  RESET_BASE_URL: {{ .Values.api.env.resetBaseUrl | quote }}
  {{- else if .Values.ingress.enabled }}
  RESET_BASE_URL: {{ printf "https://%s" .Values.ingress.host | quote }}
  {{- end }}
  {{- if .Values.api.env.throttleTtl }}
  THROTTLE_TTL: {{ .Values.api.env.throttleTtl | quote }}
  {{- end }}
  {{- if .Values.api.env.throttleLimit }}
  THROTTLE_LIMIT: {{ .Values.api.env.throttleLimit | quote }}
  {{- end }}
  {{- if .Values.api.env.throttleAuthLimit }}
  THROTTLE_AUTH_LIMIT: {{ .Values.api.env.throttleAuthLimit | quote }}
  {{- end }}
  {{- if .Values.api.env.rateLimitDisabled }}
  RATE_LIMIT_DISABLED: "true"
  {{- end }}
  {{- if .Values.api.env.webhookAllowPrivate }}
  WEBHOOK_ALLOW_PRIVATE: "true"
  {{- end }}
  AUTO_SEED: {{ .Values.api.env.autoSeed | quote }}
{{- if eq .Values.web.apiMode "same-origin" }}
---
{{/*
  nginx config for the web pod in same-origin mode: serve the SPA and
  reverse-proxy /api and /socket.io to the API Service so the browser only ever
  talks to one origin (no CORS, one ingress host, no rebuild per environment).
  This OVERRIDES the image's default /etc/nginx/conf.d/default.conf via a mount.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "next-lane.componentName" (dict "ctx" . "component" "web-nginx") }}
  labels:
    {{- include "next-lane.componentLabels" (dict "ctx" . "component" "web") | nindent 4 }}
data:
  default.conf: |
    server {
      listen {{ .Values.web.port }};
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # ── Security headers ──────────────────────────────────────────────────
      # The API sets its own headers via Helmet; the SPA needs its own. In
      # same-origin mode the browser only ever talks to this origin, so
      # connect-src 'self' covers /api and the /socket.io WebSocket. If you put
      # the API on a SEPARATE origin (web.apiMode=external), widen connect-src
      # to include that origin + ws/wss, e.g.:
      #   connect-src 'self' https://api.example.com wss://api.example.com;
      # style-src allows 'unsafe-inline' (the app uses inline styles); scripts
      # are restricted to 'self' (no inline/eval). `always` covers errors too.
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;

      # Runtime config written by the entrypoint to a writable volume (the html
      # dir is read-only under readOnlyRootFilesystem). Served here via `alias`
      # and never cached, so an env change takes effect on the next start.
      location = /config.js {
        alias /usr/share/nginx/runtime/config.js;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        # nginx drops inherited add_header when a location sets its own, so
        # re-emit the security headers here.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      }

      # SPA fallback — all client routes resolve to index.html.
      location / {
        try_files $uri $uri/ /index.html;
      }

      # Cache hashed build assets aggressively.
      location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # nginx drops inherited add_header when a location sets its own, so
        # re-emit the security headers here.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      }

      # Reverse-proxy the REST API (NestJS global prefix is /api; /health is
      # also proxied for convenience).
      location /api/ {
        proxy_pass http://{{ include "next-lane.componentName" (dict "ctx" . "component" "api") }}:{{ .Values.api.service.port }}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
      }

      # Socket.io realtime (WebSocket upgrade).
      location /socket.io/ {
        proxy_pass http://{{ include "next-lane.componentName" (dict "ctx" . "component" "api") }}:{{ .Values.api.service.port }}/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
      }
    }
{{- end }}
