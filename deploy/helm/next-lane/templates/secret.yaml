{{- /*
  Chart-managed Secret. Created ONLY when secrets.existingSecret is empty.
  There is NO baked default — secrets.jwtSecret MUST be provided, otherwise the
  template fails fast with a clear error (the API also refuses to start without
  JWT_SECRET).

  Production recommendation: do NOT use this template. Manage the Secret out of
  band (external-secrets / sealed-secrets / SOPS / a cloud secret manager) and
  set secrets.existingSecret to its name. The required keys are:
    JWT_SECRET, DATABASE_URL (if external DB), REDIS_URL (if external Redis).
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- if not .Values.secrets.jwtSecret }}
{{- fail "secrets.jwtSecret is required (no default is provided). Set it with --set secrets.jwtSecret=$(openssl rand -hex 32), or set secrets.existingSecret to a Secret you manage (external-secrets/sealed-secrets)." }}
{{- end }}
{{- /*
  Fail fast on the insecure default password for the BUNDLED PostgreSQL. The
  chart ships postgresql.auth.password=nextlane only as a placeholder; rendering
  with it (or an empty value) would deploy a publicly-known DB password. Mirror
  the JWT-secret guard above and refuse to render until it's changed. Bypass
  intentionally with --set postgresql.auth.allowInsecurePassword=true (NOT for
  real use), or disable the bundled DB and use externalDatabase.
*/ -}}
{{- if .Values.postgresql.enabled }}
{{- $pgPass := .Values.postgresql.auth.password }}
{{- if and (not .Values.postgresql.auth.existingSecret) (not .Values.postgresql.auth.allowInsecurePassword) (or (not $pgPass) (eq $pgPass "nextlane")) }}
{{- fail "postgresql.auth.password is unset or still the insecure default ('nextlane'). Set a strong password with --set postgresql.auth.password=$(openssl rand -hex 24), or point postgresql.auth.existingSecret at a Secret you manage, or disable the bundled DB (postgresql.enabled=false) and use externalDatabase. To override anyway (NOT recommended): --set postgresql.auth.allowInsecurePassword=true." }}
{{- end }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "next-lane.secretName" . }}
  labels:
    {{- include "next-lane.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}

  {{- /* DATABASE_URL: bundled subchart → derived; external → explicit URL or assembled parts. */ -}}
  {{- if .Values.postgresql.enabled }}
  DATABASE_URL: {{ include "next-lane.bundledDatabaseUrl" . | quote }}
  {{- else if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- else if .Values.externalDatabase.host }}
  DATABASE_URL: {{ include "next-lane.externalDatabaseUrl" . | quote }}
  {{- else }}
  {{- fail "No database configured: enable postgresql, or set secrets.databaseUrl, or set externalDatabase.host." }}
  {{- end }}

  {{- /* REDIS_URL is optional (single-replica works without it). */ -}}
  {{- if .Values.redis.enabled }}
  REDIS_URL: {{ include "next-lane.bundledRedisUrl" . | quote }}
  {{- else if .Values.secrets.redisUrl }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  {{- else if .Values.externalRedis.host }}
  REDIS_URL: {{ include "next-lane.externalRedisUrl" . | quote }}
  {{- end }}
{{- end }}
