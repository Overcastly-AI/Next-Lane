{{- include "next-lane.validateUploadsScaling" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "next-lane.componentName" (dict "ctx" . "component" "api") }}
  labels:
    {{- include "next-lane.componentLabels" (dict "ctx" . "component" "api") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- if not .Values.api.autoscaling.enabled }}
  replicas: {{ .Values.api.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "next-lane.componentSelectorLabels" (dict "ctx" . "component" "api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "next-lane.componentLabels" (dict "ctx" . "component" "api") | nindent 8 }}
        {{- with .Values.api.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Roll the pods when the non-secret config changes.
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        {{- with .Values.api.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "next-lane.serviceAccountName" . }}
      {{- include "next-lane.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.migrations.runAsInitContainer }}
      initContainers:
        # Run `prisma migrate deploy` as part of pod startup. This makes schema
        # migration part of the normal install graph (no Helm hook), so it works
        # with the bundled Postgres (a normal resource) and is `helm --wait`-safe:
        # the pod only becomes Ready after migrations succeed. The retry loop
        # tolerates the DB not being reachable yet (e.g. Postgres still starting).
        # Prisma's advisory migration lock makes concurrent replica runs safe.
        - name: migrate
          image: {{ include "next-lane.apiImage" . }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          {{- with .Values.api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          command:
            - sh
            - -c
            - |
              echo "Applying database migrations (waiting for the database if needed)...";
              attempt=0;
              max={{ .Values.migrations.initRetries | default 60 }};
              delay={{ .Values.migrations.initRetryDelaySeconds | default 5 }};
              until npx prisma migrate deploy; do
                attempt=$((attempt+1));
                if [ "$attempt" -ge "$max" ]; then
                  echo "Migrations did not succeed after $attempt attempts — giving up.";
                  exit 1;
                fi;
                echo "Database not ready or migrate failed (attempt $attempt/$max) — retrying in ${delay}s...";
                sleep "$delay";
              done;
              echo "Database migrations applied.";
          envFrom:
            - secretRef:
                name: {{ include "next-lane.secretName" . }}
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- end }}
      containers:
        - name: api
          image: {{ include "next-lane.apiImage" . }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          {{- with .Values.api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # Start the compiled server directly. Migrations run in the `migrate`
          # initContainer above (migrations.runAsInitContainer, default), or in
          # the opt-in pre-install hook Job (templates/migrations-job.yaml) when
          # that strategy is selected — never in this container.
          command: ["node", "dist/main.js"]
          ports:
            - name: http
              containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: {{ include "next-lane.componentName" (dict "ctx" . "component" "api-config") }}
            - secretRef:
                name: {{ include "next-lane.secretName" . }}
            {{- with .Values.api.extraEnvFrom }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- with .Values.api.extraEnv }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- if .Values.api.probes.startup.enabled }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: {{ .Values.api.probes.startup.periodSeconds }}
            failureThreshold: {{ .Values.api.probes.startup.failureThreshold }}
          {{- end }}
          {{- if .Values.api.probes.liveness.enabled }}
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.api.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.liveness.failureThreshold }}
          {{- end }}
          {{- if .Values.api.probes.readiness.enabled }}
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: {{ .Values.api.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.api.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.api.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.api.probes.readiness.failureThreshold }}
          {{- end }}
          {{- with .Values.api.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          volumeMounts:
            # Writable tmp (required because the root FS is read-only).
            - name: tmp
              mountPath: /tmp
            # Uploaded attachments.
            - name: uploads
              mountPath: {{ .Values.api.uploads.mountPath }}
      volumes:
        - name: tmp
          emptyDir: {}
        - name: uploads
          {{- if .Values.api.uploads.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "next-lane.componentName" (dict "ctx" . "component" "uploads") }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
