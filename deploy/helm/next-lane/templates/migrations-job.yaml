{{- if and .Values.migrations.enabled (not .Values.migrations.runAsInitContainer) }}
{{- /*
  OPT-IN alternative to the API init-container (migrations.runAsInitContainer).
  Pre-install / pre-upgrade hook that runs `prisma migrate deploy` BEFORE the API
  Deployment. Suitable ONLY with an already-running EXTERNAL database — a Helm
  pre-install hook runs before all normal resources, so it cannot reach the
  bundled Postgres (which starts in the main phase). For the bundled DB, keep the
  default init-container strategy (migrations.runAsInitContainer=true).
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "next-lane.componentName" (dict "ctx" . "component" "migrate") }}
  labels:
    {{- include "next-lane.componentLabels" (dict "ctx" . "component" "migrate") | nindent 4 }}
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": {{ .Values.migrations.hookWeight | quote }}
    "helm.sh/hook-delete-policy": {{ .Values.migrations.hookDeletePolicy }}
spec:
  backoffLimit: {{ .Values.migrations.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migrations.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "next-lane.componentSelectorLabels" (dict "ctx" . "component" "migrate") | nindent 8 }}
    spec:
      restartPolicy: Never
      {{- /*
        This Job is a pre-install/pre-upgrade HOOK, so it runs BEFORE the chart's
        ServiceAccount (a normal resource) exists — referencing it here fails with
        "serviceaccount not found" and aborts the release. The migration only
        needs database access (DATABASE_URL secret), not the Kubernetes API, so it
        runs under the namespace "default" ServiceAccount with no token mounted.
        Set `migrations.serviceAccountName` only to pin a PRE-EXISTING SA (e.g.
        IRSA / Workload Identity for IAM database auth).
      */ -}}
      {{- with .Values.migrations.serviceAccountName }}
      serviceAccountName: {{ . }}
      {{- end }}
      automountServiceAccountToken: false
      {{- include "next-lane.imagePullSecrets" . | nindent 6 }}
      {{- with .Values.api.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: migrate
          image: {{ include "next-lane.apiImage" . }}
          imagePullPolicy: {{ .Values.image.api.pullPolicy }}
          {{- with .Values.api.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # apps/api is the WORKDIR in the runtime image, where prisma/ lives.
          command: ["npx", "prisma", "migrate", "deploy"]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "next-lane.secretName" . }}
                  key: DATABASE_URL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          {{- with .Values.migrations.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
      {{- with .Values.api.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.api.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
