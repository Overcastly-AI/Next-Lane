# EXAMPLE Secret — DO NOT COMMIT REAL SECRETS.
#
# This placeholder exists so the base renders. In a real deployment, replace it
# with a Secret managed by external-secrets / sealed-secrets / SOPS, or generate
# it out of band, e.g.:
#
#   kubectl -n next-lane create secret generic next-lane-secrets \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 32)" \
#     --from-literal=DATABASE_URL="postgresql://user:pass@db:5432/nextlane?schema=public" \
#     --from-literal=REDIS_URL="redis://redis:6379"
#
# REDIS_URL is OPTIONAL (omit for single-replica mode). The values below are
# OBVIOUS PLACEHOLDERS — they are NOT a usable secret.
apiVersion: v1
kind: Secret
metadata:
  name: next-lane-secrets
  labels:
    app.kubernetes.io/name: next-lane
type: Opaque
stringData:
  JWT_SECRET: "REPLACE_ME_WITH_openssl_rand_hex_32"
  DATABASE_URL: "postgresql://nextlane:REPLACE_ME@db.example.com:5432/nextlane?schema=public"
  # REDIS_URL: "redis://redis.example.com:6379"   # uncomment for HA
