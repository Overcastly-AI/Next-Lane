# nginx config for the web pod: serve the SPA + reverse-proxy /api and
# /socket.io to the API Service (same-origin mode — web image built with empty
# VITE_API_URL). Mounted over /etc/nginx/conf.d in the web Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: next-lane-web-nginx
  labels:
    app.kubernetes.io/name: next-lane
    app.kubernetes.io/component: web
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      # Security headers — the SPA needs its own (the API uses Helmet). In
      # same-origin mode connect-src 'self' covers /api + the /socket.io
      # WebSocket. For a SEPARATE API origin, widen connect-src to that origin
      # + ws/wss, e.g. connect-src 'self' https://api.example.com wss://api.example.com;
      # style-src allows 'unsafe-inline' (inline styles); scripts stay 'self'.
      add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
      add_header X-Content-Type-Options "nosniff" always;
      add_header X-Frame-Options "SAMEORIGIN" always;
      add_header Referrer-Policy "strict-origin-when-cross-origin" always;

      # Runtime config written by the entrypoint to a writable volume (the html
      # dir is read-only under readOnlyRootFilesystem). Served via `alias` and
      # never cached, so an env change takes effect on the next container start.
      location = /config.js {
        alias /usr/share/nginx/runtime/config.js;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        # Re-emit security headers (nginx drops inherited add_header here).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      }

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # Re-emit security headers (nginx drops inherited add_header here).
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
      }

      location /api/ {
        proxy_pass http://next-lane-api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
      }

      location /socket.io/ {
        proxy_pass http://next-lane-api:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
      }
    }
