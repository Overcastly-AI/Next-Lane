# nginx config for the web pod: serve the SPA + reverse-proxy /api and
# /socket.io to the API Service (same-origin mode — web image built with empty
# VITE_API_URL). Mounted over /etc/nginx/conf.d in the web Deployment.
apiVersion: v1
kind: ConfigMap
metadata:
  name: next-lane-web-nginx
  labels:
    app.kubernetes.io/name: next-lane
    app.kubernetes.io/component: web
data:
  default.conf: |
    server {
      listen 80;
      server_name _;
      root /usr/share/nginx/html;
      index index.html;

      location / {
        try_files $uri $uri/ /index.html;
      }

      location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
      }

      location /api/ {
        proxy_pass http://next-lane-api:4000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
      }

      location /socket.io/ {
        proxy_pass http://next-lane-api:4000/socket.io/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
      }
    }
