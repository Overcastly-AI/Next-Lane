apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: next-lane-web
  labels:
    app.kubernetes.io/name: next-lane
    app.kubernetes.io/component: web
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: next-lane
      app.kubernetes.io/component: web
