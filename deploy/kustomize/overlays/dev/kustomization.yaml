# DEV overlay — single replica, no TLS, local hostname, demo seed ON.
# Apply:  kubectl apply -k deploy/kustomize/overlays/dev
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: next-lane-dev

resources:
  - namespace.yaml
  - ../../base

# Mutable dev image tag — override the version the base pins.
#
# `name:` MUST be the image name as it exists AFTER the base's transformer has
# run (i.e. fully qualified), not the bare `next-lane-api` the manifests are
# authored with. Kustomize matches an image transformer against the manifest's
# CURRENT image, and the base has already rewritten it — keyed on the short
# name these entries silently no-op'd and dev inherited the base's pinned tag.
images:
  - name: ghcr.io/overcastly-ai/next-lane-api
    newTag: latest
  - name: ghcr.io/overcastly-ai/next-lane-web
    newTag: latest

patches:
  # Dev hostname + CORS + demo seed on.
  - path: configmap-dev.yaml
    target:
      kind: ConfigMap
      name: next-lane-api-config
  # Single web replica in dev.
  - path: replicas-dev.yaml
    target:
      kind: Deployment
      name: next-lane-web
  # Plain-HTTP ingress (no cert-manager / TLS) for a local cluster.
  - path: ingress-dev.yaml
    target:
      kind: Ingress
      name: next-lane
