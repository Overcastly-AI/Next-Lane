server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Runtime config — must NOT be cached so env changes take effect on next start.
  # The entrypoint regenerates this file on every container start.
  location = /config.js {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
  }

  # SPA fallback — all routes resolve to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed assets aggressively
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
