server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers ──────────────────────────────────────────────────────
  # The API sets its own headers via Helmet; the SPA served here needs its own.
  # `always` ensures the headers are emitted on error responses too.
  #
  # connect-src: the placeholder `__NL_CONNECT_SRC__` is substituted by
  # docker-entrypoint.sh at container start. The standalone web image talks to a
  # SEPARATE API origin (e.g. http://localhost:4000 in Compose), so the entrypoint
  # expands it to `'self' <API_ORIGIN> <ws(s)://API_ORIGIN>` derived from API_URL.
  # (The Helm same-origin deployment uses its own nginx ConfigMap where the API
  # is reverse-proxied under /api, so connect-src stays 'self' there.)
  # style-src allows 'unsafe-inline' because the app uses inline styles; we do
  # NOT allow inline/eval for scripts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src __NL_CONNECT_SRC__; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Runtime config — must NOT be cached so env changes take effect on next start.
  # The entrypoint regenerates this file on every container start.
  location = /config.js {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    # nginx does NOT inherit outer add_header once a location sets its own, so
    # re-emit the security headers here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src __NL_CONNECT_SRC__; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # SPA fallback — all routes resolve to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed assets aggressively
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Re-emit security headers (see note in /config.js above).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src __NL_CONNECT_SRC__; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
