server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # ── Security headers ──────────────────────────────────────────────────────
  # The API sets its own headers via Helmet; the SPA served here needs its own.
  # `always` ensures the headers are emitted on error responses too.
  #
  # connect-src allows same-origin (this image bakes an empty VITE_API_URL and
  # the app calls /api + /socket.io on its own origin). If you build the web
  # image with VITE_API_URL pointing at a SEPARATE API origin, widen connect-src
  # to include that origin and its ws/wss scheme, e.g.:
  #   connect-src 'self' https://api.example.com wss://api.example.com;
  # style-src allows 'unsafe-inline' because the app uses inline styles; we do
  # NOT allow inline/eval for scripts.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;

  # Runtime config — must NOT be cached so env changes take effect on next start.
  # The entrypoint regenerates this file on every container start.
  location = /config.js {
    expires off;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
    # nginx does NOT inherit outer add_header once a location sets its own, so
    # re-emit the security headers here.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }

  # SPA fallback — all routes resolve to index.html
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Cache hashed assets aggressively
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    # Re-emit security headers (see note in /config.js above).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  }
}
