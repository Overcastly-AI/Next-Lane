<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next Lane</title>
    <meta
      name="description"
      content="Next Lane is a free, open-source, self-hosted issue and project tracker with boards, backlogs, roadmaps and an AI-agent-native API."
    />
    <!-- Browser chrome colour follows the OS scheme; both values are the app canvas (--nl-ink-50). -->
    <meta name="theme-color" content="#f4f6f9" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#161a23" media="(prefers-color-scheme: dark)" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Next Lane" />
    <meta property="og:title" content="Next Lane — issue and project tracking you own" />
    <meta
      property="og:description"
      content="Free, open-source, self-hosted issue and project tracker with boards, roadmaps and a first-class API and MCP server for AI agents."
    />
    <meta property="og:image" content="/icon-512.png" />
    <meta name="twitter:card" content="summary" />
    <!--
      Runtime configuration: injected by the container entrypoint at startup.
      Sets window.__NL_CONFIG__ = { apiUrl: "..." } so ONE built image works
      across every deployment environment without a rebuild.
      In local dev (pnpm dev / vite preview) this file is NOT present; the app
      falls back to import.meta.env.VITE_API_URL → 'http://localhost:4000'.
    -->
    <script src="/config.js" onerror="/* config.js absent — dev/preview mode */"></script>
    <!--
      Synchronous theme bootstrap — runs before any CSS/JS bundle paints so
      there is no flash of the wrong theme. Mirrors the `nl.theme` preference
      written by ThemeContext (src/contexts/ThemeContext.tsx): 'light' |
      'dark' | 'system' (default, falls back to `prefers-color-scheme`).
      Served as a self-hosted static file (public/theme-init.js) — NOT an
      inline <script> — so it satisfies a strict `script-src 'self'` CSP
      (see nginx.conf) with no 'unsafe-inline'/nonce/hash needed. Loaded as
      a normal BLOCKING script (no `defer`/`type=module`) so it still runs
      before the app bundle mounts, preserving the same no-flash guarantee.
      Kept deliberately tiny and dependency-free — this is the ONE place in
      the app allowed to touch the DOM before React mounts.
    -->
    <script src="/theme-init.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
