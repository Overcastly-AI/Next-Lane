<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Next Lane</title>
    <!--
      Runtime configuration: injected by the container entrypoint at startup.
      Sets window.__NL_CONFIG__ = { apiUrl: "..." } so ONE built image works
      across every deployment environment without a rebuild.
      In local dev (pnpm dev / vite preview) this file is NOT present; the app
      falls back to import.meta.env.VITE_API_URL → 'http://localhost:4000'.
    -->
    <script src="/config.js" onerror="/* config.js absent — dev/preview mode */"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
